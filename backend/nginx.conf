# RasickEx Nginx Production Configuration Template
# Place in /etc/nginx/sites-available/rasick-backend and symlink to sites-enabled

upstream rasick_upstream {
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL Configuration (Let's Encrypt managed paths)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Security protocol settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Log target paths
    access_log /var/log/nginx/rasick_access.log;
    error_log /var/log/nginx/rasick_error.log;

    # Reverse proxy mappings to Express server backend
    location / {
        proxy_pass http://rasick_upstream;
        proxy_http_version 1.1;
        
        # Connection parameter configurations
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable buffer parameters for audio streaming stability
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
        
        # Max request payload settings (match client uploads limit + padding)
        client_max_body_size 60M;
    }
}
